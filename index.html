<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0F1F3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Asistente">
<meta name="referrer" content="no-referrer">
<title>Asistente Hallopy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --navy:#0F1F3D; --azul:#1E3A6E; --acento:#4A90D9;
    --fondo:#EEF1F6; --burbuja:#FFFFFF; --mia:#1E3A6E; --texto:#14213D; --suave:#5B6780; --linea:#DDE3EE; --alerta:#C0392B;
  }
  @media (prefers-color-scheme: dark){
    :root{ --fondo:#0B1527; --burbuja:#16243F; --mia:#2B5BA8; --texto:#E7ECF5; --suave:#93A1BC; --linea:#22324F; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--texto);display:flex;flex-direction:column;height:100dvh}
  header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
  header .marca{font-family:"Arial Black",Arial,sans-serif;font-size:18px;flex:1}
  header .estado{font-size:12px;color:#B9C7E0;display:block;font-family:Arial,sans-serif;font-weight:normal;margin-top:2px}
  header button{background:var(--azul);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:13px}
  #chat{flex:1;overflow-y:auto;padding:16px 12px 8px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:84%;padding:10px 13px;border-radius:16px;line-height:1.38;font-size:15.5px;white-space:pre-wrap;word-wrap:break-word}
  .msg.el{background:var(--burbuja);align-self:flex-start;border-bottom-left-radius:5px;border:1px solid var(--linea)}
  .msg.yo{background:var(--mia);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
  .msg.error{background:transparent;border:1px dashed var(--alerta);color:var(--alerta)}
  .hora{font-size:11px;opacity:.6;margin-top:4px;text-align:right;font-family:"Courier New",monospace}
  .escribiendo{align-self:flex-start;color:var(--suave);font-size:14px;padding:6px 12px}
  .escribiendo span{display:inline-block;animation:p 1.2s infinite}
  .escribiendo span:nth-child(2){animation-delay:.2s}.escribiendo span:nth-child(3){animation-delay:.4s}
  @keyframes p{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .atajos{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}
  .atajos button{flex:none;background:var(--burbuja);border:1px solid var(--linea);color:var(--texto);border-radius:999px;padding:8px 12px;font-size:13.5px}
  form{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--fondo);border-top:1px solid var(--linea)}
  textarea{flex:1;resize:none;border:1px solid var(--linea);border-radius:20px;padding:11px 14px;font:inherit;font-size:16px;max-height:140px;background:var(--burbuja);color:var(--texto)}
  form button{width:46px;height:46px;border-radius:50%;border:0;background:var(--acento);color:#fff;font-size:20px;align-self:flex-end}
  form button:disabled{opacity:.45}
  .bloqueo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;gap:12px;max-width:460px;margin:0 auto;width:100%}
  .bloqueo h1{margin:0;font-size:22px}
  .bloqueo p{margin:0;color:var(--suave);line-height:1.4}
  .bloqueo input{padding:14px;border-radius:12px;border:1px solid var(--linea);font-size:16px;background:var(--burbuja);color:var(--texto)}
  .bloqueo button{padding:15px;border:0;border-radius:12px;background:var(--azul);color:#fff;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<header>
  <div class="marca">Asistente<span class="estado" id="estado">en línea</span></div>
  <button id="btnInstalar" style="display:none;background:var(--acento)">Instalar</button>
  <button id="btnMenu" aria-label="Opciones">Opciones</button>
</header>
<div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>

<script>
const API = 'https://hook.us2.make.com/sit9bphdnqh2ojcp2pp89b3nt8mqo9b6';
const ATAJOS = ['¿Qué tengo hoy?', '¿Qué tengo esta semana?', 'Mis pendientes', 'Recuérdame '];

const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const leer = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const borrar = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
const $ = (id) => document.getElementById(id);

// La llave llega una sola vez en el link (#k=...), se guarda en este celular y se borra de la barra de direcciones.
// Lo que va después de # nunca se manda a GitHub ni a ningún servidor.
function tomarLlave() {
  const m = location.hash.match(/k=([^&]+)/);
  if (!m) return false;
  guardar('asis_key', decodeURIComponent(m[1]));
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}
tomarLlave();
window.addEventListener('hashchange', () => { if (tomarLlave()) pantallaChat(); });

let historial = [];
try { historial = JSON.parse(leer('asis_hist') || '[]'); } catch (e) { historial = []; }
const guardarHist = () => guardar('asis_hist', JSON.stringify(historial.slice(-80)));
const horaDe = (t) => new Date(t).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: false });

function pantallaLlave(mensaje) {
  $('app').innerHTML = `<div class="bloqueo">
      <h1>Conecta este celular</h1>
      <p>${mensaje || 'Pega tu llave para que el asistente sepa que eres tú. Solo se hace una vez por celular.'}</p>
      <input id="inLlave" type="password" autocomplete="off" placeholder="Llave">
      <button id="btnLlave">Conectar</button>
    </div>`;
  $('btnLlave').onclick = () => { const v = $('inLlave').value.trim(); if (v) { guardar('asis_key', v); pantallaChat(); } };
}

function pantallaChat() {
  $('app').innerHTML = `<div id="chat" aria-live="polite"></div>
    <div class="atajos" id="atajos">${ATAJOS.map((a) => `<button type="button">${a}</button>`).join('')}</div>
    <form id="form"><textarea id="txt" rows="1" placeholder="Escríbele a tu asistente…"></textarea><button id="btnEnviar" aria-label="Enviar">➤</button></form>`;
  if (!historial.length) historial.push({ de: 'el', t: Date.now(), texto: '¡Hola! Pídeme lo mismo que en Telegram: pendientes, recordatorios, juntas, correos.' });
  historial.forEach(pintarMsg);
  abajo();
  const txt = $('txt');
  txt.addEventListener('input', () => { txt.style.height = 'auto'; txt.style.height = Math.min(txt.scrollHeight, 140) + 'px'; });
  txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); enviar(); } });
  $('form').addEventListener('submit', (e) => { e.preventDefault(); enviar(); });
  $('atajos').querySelectorAll('button').forEach((b) => b.onclick = () => {
    if (b.textContent.endsWith(' ')) { txt.value = b.textContent; txt.focus(); } else { txt.value = b.textContent; enviar(); }
  });
}

function pintarMsg(m) {
  const d = document.createElement('div');
  d.className = 'msg ' + m.de;
  d.textContent = m.texto;
  const h = document.createElement('div'); h.className = 'hora'; h.textContent = horaDe(m.t); d.appendChild(h);
  $('chat').appendChild(d);
}
const abajo = () => { const c = $('chat'); if (c) c.scrollTop = c.scrollHeight; };

let ocupado = false;
async function enviar() {
  const txt = $('txt'); const texto = txt.value.trim();
  if (!texto || ocupado) return;
  const llave = leer('asis_key'); if (!llave) return pantallaLlave();
  ocupado = true; $('btnEnviar').disabled = true;
  txt.value = ''; txt.style.height = 'auto';
  const yo = { de: 'yo', t: Date.now(), texto }; historial.push(yo); guardarHist(); pintarMsg(yo);
  const esc = document.createElement('div'); esc.className = 'escribiendo'; esc.innerHTML = 'pensando <span>●</span><span>●</span><span>●</span>';
  $('chat').appendChild(esc); abajo(); $('estado').textContent = 'escribiendo…';
  let resp;
  try {
    const r = await fetch(API, { method: 'POST', body: new URLSearchParams({ key: llave, texto }) });
    const cuerpo = (await r.text()).trim();
    if (r.status === 401) { esc.remove(); borrar('asis_key'); ocupado = false; return pantallaLlave('Esa llave no es válida. Pégala otra vez.'); }
    if (!r.ok) throw new Error('status ' + r.status);
    resp = { de: 'el', t: Date.now(), texto: (!cuerpo || cuerpo === 'Accepted') ? 'Recibí tu mensaje, pero no alcancé a contestarte. Revisa en un momento o vuelve a preguntar.' : cuerpo };
  } catch (e) {
    resp = { de: 'el error', t: Date.now(), texto: 'Sin conexión. No se envió; inténtalo otra vez.' };
  }
  esc.remove(); $('estado').textContent = 'en línea';
  if (resp.de === 'el') { historial.push(resp); guardarHist(); }
  pintarMsg(resp); abajo();
  ocupado = false; $('btnEnviar').disabled = false;
}

$('btnMenu').onclick = () => {
  const op = prompt('Opciones:\n1 = Borrar la conversación de este celular\n2 = Desconectar este celular (quita la llave)\n\nEscribe 1 o 2:');
  if (op === '1') { historial = []; guardarHist(); pantallaChat(); }
  if (op === '2') { borrar('asis_key'); pantallaLlave(); }
};

// Chrome avisa cuando la página se puede instalar como app de verdad; ahí mostramos el botón.
let instalador = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); instalador = e; $('btnInstalar').style.display = ''; });
$('btnInstalar').onclick = async () => { if (!instalador) return; instalador.prompt(); await instalador.userChoice; instalador = null; $('btnInstalar').style.display = 'none'; };
window.addEventListener('appinstalled', () => { $('btnInstalar').style.display = 'none'; });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
leer('asis_key') ? pantallaChat() : pantallaLlave();
</script>
</body>
</html>
